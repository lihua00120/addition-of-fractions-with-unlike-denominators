<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分數像素畫設計師</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts for a cute, rounded look -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    animation: {
                        'bounce-short': 'bounce-short 0.5s ease-in-out',
                        'wiggle': 'wiggle 1s ease-in-out infinite',
                    },
                    keyframes: {
                        'bounce-short': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        'wiggle': {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles for grid transitions and cute effects */
        body { background-color: #f0f9ff; /* sky-50 */ }
        .pixel-cell {
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        }
        .pixel-cell:hover {
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .pixel-cell.color-red { background-color: #ef4444; } /* red-500 */
        .pixel-cell.color-blue { background-color: #3b82f6; } /* blue-500 */
        .pixel-cell.color-yellow { background-color: #eab308; } /* yellow-500 */
        .pixel-cell.color-eraser { background-color: #ffffff; }
        
        .tool-btn.active {
            transform: scale(1.1);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            border-color: #4f46e5; /* indigo-600 */
            border-width: 4px;
        }
        
        /* Hide scrollbar for canvas if it gets too big */
        .canvas-container::-webkit-scrollbar { display: none; }
        .canvas-container { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 pb-12">

    <!-- Header -->
    <header class="bg-white shadow-sm py-5 mb-8 text-center border-b-4 border-indigo-100">
        <h1 class="text-4xl font-black text-indigo-600 tracking-wide flex items-center justify-center gap-3">
            🎨 分數像素畫設計師
        </h1>
        <p class="text-slate-500 mt-2 font-bold text-lg">用顏色畫出神奇的分數魔法吧！</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Controls & Stats -->
        <div class="lg:col-span-4 space-y-6">
            
            <!-- Settings Panel -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border-2 border-slate-100 relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-yellow-300 text-yellow-900 font-bold px-3 py-1 rounded-bl-xl text-sm">
                    第 1 步
                </div>
                <h2 class="text-2xl font-bold mb-4 flex items-center gap-2 text-indigo-700">
                    📏 選擇畫布大小
                </h2>
                
                <div class="grid grid-cols-2 gap-3 mb-5">
                    <button class="preset-btn bg-indigo-50 text-indigo-700 font-bold py-3 rounded-2xl hover:bg-indigo-100 transition-colors border-2 border-transparent" data-size="36">36格 (6x6)</button>
                    <button class="preset-btn bg-indigo-50 text-indigo-700 font-bold py-3 rounded-2xl hover:bg-indigo-100 transition-colors border-2 border-transparent" data-size="48">48格 (8x6)</button>
                    <button class="preset-btn bg-indigo-50 text-indigo-700 font-bold py-3 rounded-2xl hover:bg-indigo-100 transition-colors border-2 border-transparent" data-size="64">64格 (8x8)</button>
                    <button class="preset-btn bg-indigo-50 text-indigo-700 font-bold py-3 rounded-2xl hover:bg-indigo-100 transition-colors border-2 border-transparent" data-size="100">100格(10x10)</button>
                </div>

                <div class="flex gap-2">
                    <input type="number" id="custom-size" min="1" max="144" placeholder="自訂格數 (最大144)..." class="flex-1 px-4 py-3 border-2 border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-400 font-bold text-lg">
                    <button id="btn-set-custom" class="bg-indigo-600 text-white px-5 py-3 rounded-2xl font-bold hover:bg-indigo-700 transition-colors shadow-md">
                        設定
                    </button>
                </div>
            </div>

            <!-- Stats Panel (Hidden if invalid canvas) -->
            <div id="stats-panel" class="bg-white p-6 rounded-3xl shadow-sm border-2 border-slate-100 relative">
                <div class="absolute top-0 right-0 bg-green-300 text-green-900 font-bold px-3 py-1 rounded-bl-xl text-sm">
                    任務目標
                </div>
                <h2 class="text-2xl font-bold mb-4 text-slate-700">🎯 塗色進度</h2>
                
                <div class="space-y-4">
                    <!-- Red Stats -->
                    <div class="flex justify-between items-center bg-red-50 p-4 rounded-2xl border border-red-100">
                        <div class="flex items-center gap-3">
                            <div class="w-6 h-6 bg-red-500 rounded-md shadow-sm"></div>
                            <div>
                                <span class="font-bold text-red-700 block">紅色 (1/3)</span>
                                <span id="hint-red" class="text-xs text-red-500 font-bold"></span>
                            </div>
                        </div>
                        <span class="font-black text-2xl text-red-700"><span id="count-red">0</span> / <span id="target-red">0</span></span>
                    </div>

                    <!-- Blue Stats -->
                    <div class="flex justify-between items-center bg-blue-50 p-4 rounded-2xl border border-blue-100">
                        <div class="flex items-center gap-3">
                            <div class="w-6 h-6 bg-blue-500 rounded-md shadow-sm"></div>
                            <div>
                                <span class="font-bold text-blue-700 block">藍色 (1/4)</span>
                                <span id="hint-blue" class="text-xs text-blue-500 font-bold"></span>
                            </div>
                        </div>
                        <span class="font-black text-2xl text-blue-700"><span id="count-blue">0</span> / <span id="target-blue">0</span></span>
                    </div>

                    <!-- Yellow Stats -->
                    <div class="flex justify-between items-center bg-yellow-50 p-4 rounded-2xl border border-yellow-200">
                        <div class="flex items-center gap-3">
                            <div class="w-6 h-6 bg-yellow-400 rounded-md shadow-sm"></div>
                            <div>
                                <span class="font-bold text-yellow-700 block">黃色 (1/6)</span>
                                <span id="hint-yellow" class="text-xs text-yellow-600 font-bold"></span>
                            </div>
                        </div>
                        <span class="font-black text-2xl text-yellow-700"><span id="count-yellow">0</span> / <span id="target-yellow">0</span></span>
                    </div>

                    <!-- Total Stats -->
                    <div class="pt-4 mt-2 border-t-2 border-dashed border-slate-200">
                        <div class="flex justify-between items-center text-slate-600 font-bold">
                            <span>總共已塗色：</span>
                            <span class="font-black text-xl"><span id="count-total">0</span> / <span id="count-max">36</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Challenge Panel -->
            <div class="bg-gradient-to-br from-purple-100 to-pink-100 p-6 rounded-3xl shadow-sm border-2 border-purple-200">
                <h3 class="font-black text-xl text-purple-800 mb-3 flex items-center gap-2">
                    🏆 最小公倍數挑戰
                </h3>
                <p class="text-sm font-bold text-purple-900 leading-relaxed mb-4">
                    能完整呈現 1/3、1/4、1/6 的「最小」畫布是幾格呢？
                </p>
                <div class="flex gap-2">
                    <input type="number" id="challenge-input" placeholder="輸入數字..." class="flex-1 px-4 py-2 border-2 border-purple-300 rounded-xl font-bold focus:outline-none focus:border-purple-500">
                    <button id="btn-challenge" class="bg-purple-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-purple-700 shadow-md">送出</button>
                </div>
                <div id="challenge-msg" class="mt-3 font-bold text-center hidden"></div>
            </div>

        </div>

        <!-- Right Column: Canvas & Tools -->
        <div class="lg:col-span-8 flex flex-col gap-6">
            
            <!-- Warning Area (Visible when canvas size is invalid) -->
            <div id="warning-area" class="hidden bg-rose-100 border-4 border-rose-300 rounded-3xl p-10 flex-col items-center justify-center text-center h-full min-h-[400px]">
                <div class="text-6xl mb-4 animate-wiggle">🙀</div>
                <h2 class="text-3xl font-black text-rose-700 mb-4">哎呀！沒辦法平分！</h2>
                <p class="text-xl font-bold text-rose-800 max-w-md leading-relaxed">
                    你選擇的 <span id="warning-size" class="text-2xl text-red-600 px-2 py-1 bg-white rounded-lg"></span> 格畫布，無法完整切出 1/3、1/4 和 1/6 喔！
                    <br><br>
                    <span class="text-lg text-rose-600 bg-rose-50 px-4 py-2 rounded-xl block">💡 提示：畫布格數必須是 3、4、6 的公倍數。請試試看其他數字吧！</span>
                </p>
            </div>

            <!-- Drawing Area (Visible when valid) -->
            <div id="drawing-area" class="flex flex-col gap-6">
                
                <!-- Tools Palette -->
                <div class="bg-white p-4 rounded-3xl shadow-sm border-2 border-slate-100 flex flex-wrap justify-center gap-4 relative">
                    <div class="absolute -top-3 bg-blue-500 text-white font-bold px-4 py-1 rounded-full text-sm shadow-md">
                        第 2 步：選擇畫筆開始塗色
                    </div>
                    
                    <button class="tool-btn active flex items-center gap-2 px-5 py-3 rounded-2xl font-bold transition-all bg-red-50 text-red-700 border-2 border-transparent hover:bg-red-100" data-color="red">
                        <div class="w-6 h-6 rounded-md bg-red-500 shadow-sm border border-red-600"></div> 紅色畫筆
                    </button>
                    <button class="tool-btn flex items-center gap-2 px-5 py-3 rounded-2xl font-bold transition-all bg-blue-50 text-blue-700 border-2 border-transparent hover:bg-blue-100" data-color="blue">
                        <div class="w-6 h-6 rounded-md bg-blue-500 shadow-sm border border-blue-600"></div> 藍色畫筆
                    </button>
                    <button class="tool-btn flex items-center gap-2 px-5 py-3 rounded-2xl font-bold transition-all bg-yellow-50 text-yellow-700 border-2 border-transparent hover:bg-yellow-100" data-color="yellow">
                        <div class="w-6 h-6 rounded-md bg-yellow-400 shadow-sm border border-yellow-500"></div> 黃色畫筆
                    </button>
                    <button class="tool-btn flex items-center gap-2 px-5 py-3 rounded-2xl font-bold transition-all bg-slate-100 text-slate-700 border-2 border-transparent hover:bg-slate-200" data-color="eraser">
                        <div class="w-6 h-6 rounded-md bg-white shadow-sm border-2 border-slate-300 flex items-center justify-center text-xs">🧹</div> 橡皮擦
                    </button>
                </div>

                <!-- Canvas Grid -->
                <div class="bg-white p-8 rounded-[2.5rem] shadow-lg border-4 border-slate-200 flex flex-col items-center">
                    <div id="grid-container" class="grid gap-1 bg-slate-200 p-2 rounded-2xl w-full max-w-[600px] aspect-square canvas-container">
                        <!-- JS will populate cells here -->
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex justify-center gap-6">
                    <button id="btn-check" class="flex items-center gap-3 bg-green-500 text-white px-10 py-5 rounded-[2rem] font-black text-2xl hover:bg-green-600 hover:-translate-y-1 shadow-xl shadow-green-200 transition-all">
                        ✨ 檢查作品
                    </button>
                    <button id="btn-reset" class="flex items-center gap-2 bg-slate-200 text-slate-600 px-8 py-5 rounded-[2rem] font-bold text-xl hover:bg-slate-300 hover:-translate-y-1 shadow-lg transition-all">
                        🔄 重新開始
                    </button>
                </div>

                <!-- Message Box -->
                <div id="message-box" class="hidden p-6 rounded-3xl border-4 text-center mt-4">
                    <h3 id="message-title" class="font-black text-2xl mb-2"></h3>
                    <p id="message-body" class="text-lg font-bold whitespace-pre-line"></p>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- State ---
        let state = {
            totalCells: 36,
            activeColor: 'red',
            grid: Array(36).fill(null)
        };

        // --- DOM Elements ---
        const els = {
            presetBtns: document.querySelectorAll('.preset-btn'),
            customInput: document.getElementById('custom-size'),
            btnSetCustom: document.getElementById('btn-set-custom'),
            
            statsPanel: document.getElementById('stats-panel'),
            countRed: document.getElementById('count-red'),
            countBlue: document.getElementById('count-blue'),
            countYellow: document.getElementById('count-yellow'),
            targetRed: document.getElementById('target-red'),
            targetBlue: document.getElementById('target-blue'),
            targetYellow: document.getElementById('target-yellow'),
            countTotal: document.getElementById('count-total'),
            countMax: document.getElementById('count-max'),
            hintRed: document.getElementById('hint-red'),
            hintBlue: document.getElementById('hint-blue'),
            hintYellow: document.getElementById('hint-yellow'),

            warningArea: document.getElementById('warning-area'),
            warningSize: document.getElementById('warning-size'),
            drawingArea: document.getElementById('drawing-area'),
            
            toolBtns: document.querySelectorAll('.tool-btn'),
            gridContainer: document.getElementById('grid-container'),
            
            btnCheck: document.getElementById('btn-check'),
            btnReset: document.getElementById('btn-reset'),
            messageBox: document.getElementById('message-box'),
            messageTitle: document.getElementById('message-title'),
            messageBody: document.getElementById('message-body'),

            challengeInput: document.getElementById('challenge-input'),
            btnChallenge: document.getElementById('btn-challenge'),
            challengeMsg: document.getElementById('challenge-msg'),
        };

        // --- Initialization ---
        function init() {
            setupEventListeners();
            updateCanvasSize(state.totalCells);
        }

        // --- Event Listeners ---
        function setupEventListeners() {
            // Preset Buttons
            els.presetBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const size = parseInt(e.target.dataset.size);
                    els.customInput.value = ''; // clear custom input
                    updateCanvasSize(size);
                });
            });

            // Custom Size Setup
            els.btnSetCustom.addEventListener('click', () => {
                let size = parseInt(els.customInput.value);
                if (isNaN(size) || size < 1) size = 36;
                if (size > 144) size = 144;
                els.customInput.value = size;
                updateCanvasSize(size);
            });

            // Tools Selection
            els.toolBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    els.toolBtns.forEach(b => b.classList.remove('active', 'border-indigo-600', 'scale-110'));
                    const targetBtn = e.currentTarget;
                    targetBtn.classList.add('active');
                    state.activeColor = targetBtn.dataset.color;
                });
            });

            // Action Buttons
            els.btnReset.addEventListener('click', () => {
                state.grid = Array(state.totalCells).fill(null);
                renderGrid();
                updateStats();
                hideMessage();
            });

            els.btnCheck.addEventListener('click', checkWork);

            // Challenge Button
            els.btnChallenge.addEventListener('click', () => {
                const ans = parseInt(els.challengeInput.value);
                els.challengeMsg.classList.remove('hidden', 'text-green-600', 'text-red-600', 'bg-green-100', 'bg-red-100');
                if (ans === 12) {
                    els.challengeMsg.textContent = '🎉 答對了！12 是 3, 4, 6 的最小公倍數！';
                    els.challengeMsg.classList.add('text-green-700', 'bg-green-100', 'p-2', 'rounded-lg', 'animate-bounce-short');
                } else {
                    els.challengeMsg.textContent = '🤔 不對喔！再想想看哪個數字可以被 3, 4, 6 剛好除盡？';
                    els.challengeMsg.classList.add('text-red-600', 'bg-red-100', 'p-2', 'rounded-lg');
                }
            });
        }

        // --- Core Logic ---
        function updateCanvasSize(size) {
            state.totalCells = size;
            state.grid = Array(size).fill(null);
            
            // Highlight active preset button if matches
            els.presetBtns.forEach(btn => {
                if (parseInt(btn.dataset.size) === size && !els.customInput.value) {
                    btn.classList.add('bg-indigo-600', 'text-white');
                    btn.classList.remove('bg-indigo-50', 'text-indigo-700');
                } else {
                    btn.classList.remove('bg-indigo-600', 'text-white');
                    btn.classList.add('bg-indigo-50', 'text-indigo-700');
                }
            });

            hideMessage();

            // Validate LCM of 3, 4, 6 which is 12
            if (size % 12 !== 0) {
                els.warningSize.textContent = size;
                els.warningArea.classList.remove('hidden');
                els.warningArea.classList.add('flex');
                els.drawingArea.classList.add('hidden');
                els.statsPanel.classList.add('hidden');
            } else {
                els.warningArea.classList.add('hidden');
                els.warningArea.classList.remove('flex');
                els.drawingArea.classList.remove('hidden');
                els.statsPanel.classList.remove('hidden');
                
                // Update Target Numbers
                els.targetRed.textContent = size / 3;
                els.targetBlue.textContent = size / 4;
                els.targetYellow.textContent = size / 6;
                els.countMax.textContent = size;
                
                renderGrid();
                updateStats();
            }
        }

        function getGridCols(total) {
            if (total === 36) return 6;
            if (total === 48) return 8; // 8x6
            if (total === 64) return 8; // 8x8
            if (total === 100) return 10; // 10x10
            if (total === 144) return 12; // 12x12
            return Math.ceil(Math.sqrt(total));
        }

        function renderGrid() {
            els.gridContainer.innerHTML = '';
            const cols = getGridCols(state.totalCells);
            els.gridContainer.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
            
            // Generate cells
            for (let i = 0; i < state.totalCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'pixel-cell bg-white w-full h-full rounded-md cursor-pointer';
                
                // Restore color if any
                if (state.grid[i]) {
                    cell.classList.add(`color-${state.grid[i]}`);
                    cell.classList.remove('bg-white');
                }

                // Add Drag/Click drawing support
                cell.addEventListener('mousedown', (e) => handleCellAction(e, i, cell));
                cell.addEventListener('mouseenter', (e) => {
                    if (e.buttons === 1) handleCellAction(e, i, cell); // Drag support
                });
                
                els.gridContainer.appendChild(cell);
            }
            
            // Prevent default drag behavior on the container to allow smooth drawing
            els.gridContainer.ondragstart = () => false;
        }

        function handleCellAction(e, index, cellElement) {
            hideMessage(); // Hide hints when user starts drawing again

            if (state.activeColor === 'eraser') {
                state.grid[index] = null;
                cellElement.className = 'pixel-cell bg-white w-full h-full rounded-md cursor-pointer';
            } else {
                // If clicking same color, erase it
                if (state.grid[index] === state.activeColor && e.type === 'mousedown') {
                    state.grid[index] = null;
                    cellElement.className = 'pixel-cell bg-white w-full h-full rounded-md cursor-pointer';
                } else {
                    state.grid[index] = state.activeColor;
                    cellElement.className = `pixel-cell color-${state.activeColor} w-full h-full rounded-md cursor-pointer`;
                }
            }
            updateStats();
        }

        function updateStats() {
            const counts = { red: 0, blue: 0, yellow: 0 };
            let total = 0;

            state.grid.forEach(color => {
                if (color) {
                    if (counts[color] !== undefined) counts[color]++;
                    total++;
                }
            });

            els.countRed.textContent = counts.red;
            els.countBlue.textContent = counts.blue;
            els.countYellow.textContent = counts.yellow;
            els.countTotal.textContent = total;

            const targetR = state.totalCells / 3;
            const targetB = state.totalCells / 4;
            const targetY = state.totalCells / 6;

            // Live hints helpers
            const updateHint = (hintEl, current, target) => {
                if (current > target) {
                    hintEl.textContent = `(太多了，多 ${current - target} 格)`;
                } else if (current < target && current > 0) {
                    hintEl.textContent = `(還差 ${target - current} 格)`;
                } else {
                    hintEl.textContent = '';
                }
            }

            updateHint(els.hintRed, counts.red, targetR);
            updateHint(els.hintBlue, counts.blue, targetB);
            updateHint(els.hintYellow, counts.yellow, targetY);
        }

        function checkWork() {
            const counts = { red: 0, blue: 0, yellow: 0 };
            state.grid.forEach(c => { if(counts[c] !== undefined) counts[c]++; });

            const tR = state.totalCells / 3;
            const tB = state.totalCells / 4;
            const tY = state.totalCells / 6;

            const isRedOk = counts.red === tR;
            const isBlueOk = counts.blue === tB;
            const isYellowOk = counts.yellow === tY;

            els.messageBox.classList.remove('hidden', 'bg-green-100', 'border-green-400', 'text-green-800', 'bg-orange-100', 'border-orange-400', 'text-orange-900');
            
            if (isRedOk && isBlueOk && isYellowOk) {
                els.messageBox.classList.add('bg-green-100', 'border-green-400', 'text-green-800', 'animate-bounce-short');
                els.messageTitle.innerHTML = '🎉 太棒了！任務完成！';
                els.messageBody.innerHTML = `你完美地畫出了指定的分數：
                    🔴 紅色：${counts.red}/${state.totalCells} = 1/3
                    🔵 藍色：${counts.blue}/${state.totalCells} = 1/4
                    🟡 黃色：${counts.yellow}/${state.totalCells} = 1/6`;
            } else {
                els.messageBox.classList.add('bg-orange-100', 'border-orange-400', 'text-orange-900');
                els.messageTitle.innerHTML = '🤔 嗯...再檢查一下喔！';
                
                let hintText = '';
                if (!isRedOk) hintText += `🔴 紅色應該是總數的 1/3。算算看 ${state.totalCells} ÷ 3 = ?\n`;
                if (!isBlueOk) hintText += `🔵 藍色應該是總數的 1/4。算算看 ${state.totalCells} ÷ 4 = ?\n`;
                if (!isYellowOk) hintText += `🟡 黃色應該是總數的 1/6。算算看 ${state.totalCells} ÷ 6 = ?\n`;
                
                els.messageBody.innerHTML = hintText;
            }
        }

        function hideMessage() {
            els.messageBox.classList.add('hidden');
        }

        // Run app
        init();
    </script>
</body>
</html>
